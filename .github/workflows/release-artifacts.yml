name: Build OSArB 1.1 release artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-artifacts.yml'
      - 'packaging/**'
      - 'scripts/build/Check-AssetPolicy.ps1'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.428'
      - name: Check release exception
        shell: pwsh
        run: ./scripts/build/Check-AssetPolicy.ps1 -Mode Release -Root . -ReleaseVersion 1.1
      - name: Prepare engine and release configuration
        shell: bash
        run: |
          make engine
          printf '%s\n' 'PACKAGING_DISPLAY_NAME="OpenSA reBugged"' 'PACKAGING_INSTALLER_NAME="OpenSA-reBugged"' 'PACKAGING_OSX_LEGACY_MONO="False"' > user.config
          mkdir -p build/release
      - name: Install Linux dependency
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.platform }}
        run: ./packaging/$RELEASE_TARGET/buildpackage.sh 1.1 "$PWD/build/release"
      - name: Validate packaged Linux payload
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          chmod +x build/release/*.AppImage
          build/release/*.AppImage --appimage-extract > /dev/null
          (cd squashfs-root/usr/lib/openra && ./OpenRA.Utility sa --check-yaml)
      - name: Validate packaged macOS payload
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          hdiutil verify build/release/*.dmg
          mkdir -p "$RUNNER_TEMP/opensa-dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/opensa-dmg" build/release/*.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/opensa-dmg"' EXIT
          app="$RUNNER_TEMP/opensa-dmg/OpenSA reBugged.app/Contents"
          ENGINE_DIR="$app/Resources" "$app/MacOS/x86_64/OpenRA.Utility" sa --check-yaml
      - uses: actions/upload-artifact@v4
        with:
          name: OSArB-1.1-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
