					Y: 195
					Width: 185
					Height: 28
					Text: Neutral Colony Types...
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Set relative weights for ants, beetles, scorpions, spiders, and wasps. Zero excludes a type; all zero disables neutral colonies.
