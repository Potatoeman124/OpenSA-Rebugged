					X: 410
					Y: 115
					Width: 155
					Height: 28
					Text: Layout Family
				DropDownButton@RMG_LAYOUT_FAMILY:
					X: 570
					Y: 115
					Width: 220
					Height: 28
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Choose the overall terrain design. Natural landscapes, planned battlefields, divided territories, strongholds and labyrinths have distinct placement and route rules.

				Label@RMG_TERRAIN_COMPLEXITY_LABEL:
					X: 410
					Y: 155
					Width: 155
					Height: 28
					Text: Terrain Complexity
				DropDownButton@RMG_TERRAIN_COMPLEXITY:
					X: 570
					Y: 155
					Width: 220
					Height: 28
					Text: Standard
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Small through Ultra increase terrain detail within the same seed geography. Water Amount and Surface Modifiers control coverage separately. Land areas may be disconnected.
