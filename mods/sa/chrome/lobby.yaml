Background@SERVER_LOBBY:
	Logic: RmgLobbyLogic, LobbyLogic
		ChatTemplates:
			Chat: CHAT_LINE_TEMPLATE
			System: SYSTEM_LINE_TEMPLATE
			Mission: CHAT_LINE_TEMPLATE
			Feedback: TRANSIENT_LINE_TEMPLATE
	X: (WINDOW_RIGHT - WIDTH) / 2
	Y: (WINDOW_BOTTOM - HEIGHT) / 2
	Width: 900
	Height: 600
	Children:
		Label@SERVER_NAME:
			Y: 16
			Align: Center
			Width: PARENT_RIGHT
			Height: 25
			Font: Bold
		Button@RMG_TOGGLE_BUTTON:
			X: 20
			Y: 16
			Width: 200
			Height: 25
			Font: Bold
			Text: Random Map Generator
			Visible: False
		Container@RMG_PANEL:
			Width: 1142
			Height: 350
			Visible: False
			Children:
				Background@RMG_SETTINGS_BACKGROUND:
					Width: 820
					Height: 350
					Background: dialog3
				Background@RMG_PREVIEW_BACKGROUND:
					X: 835
					Width: 307
					Height: 350
					Background: dialog3
				Label@RMG_TITLE:
					X: 20
					Y: 2
					Width: 780
					Height: 25
					Align: Center
					Font: Bold
					Text: Random Map Generator
				Label@RMG_PRESET_LABEL:
					X: 20
					Y: 35
					Width: 130
					Height: 28
					Text: Preset
				DropDownButton@RMG_PRESET:
					X: 155
					Y: 35
					Width: 220
					Height: 28
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Select a Regions preset. Open Conflict uses Low complexity and amounts; Tactical Crossroads uses High complexity and gravel/moss.
				Label@RMG_TERRAIN_LABEL:
					X: 20
					Y: 75
					Width: 130
					Height: 28
					Text: Terrain
				DropDownButton@RMG_TERRAIN:
					X: 155
					Y: 75
					Width: 220
					Height: 28
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Normal terrain: water blocks land units; gravel and moss slow them.
				Label@RMG_SIZE_LABEL:
					X: 20
					Y: 115
					Width: 130
					Height: 28
					Text: Size
				DropDownButton@RMG_SIZE:
					X: 155
					Y: 115
					Width: 220
					Height: 28
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: 128 x 128 supports all layout families. 256 x 256 supports Natural Landscape with 2 or 4 players.
				Label@RMG_PLAYERS_LABEL:
					X: 20
					Y: 155
					Width: 130
					Height: 28
					Text: Players
				Slider@RMG_PLAYERS:
					X: 155
					Y: 157
					Width: 175
					Height: 24
					MinimumValue: 2
					MaximumValue: 4
					Value: 4
					Ticks: 2
				Label@RMG_PLAYERS_VALUE:
					X: 338
					Y: 155
					Width: 37
					Height: 28
					Align: Center
					Font: Bold
				Label@RMG_PLAYERS_MIN:
					X: 155
					Y: 179
					Width: 20
					Height: 14
					Font: Tiny
					Text: 2
				Label@RMG_PLAYERS_MAX:
					X: 310
					Y: 179
					Width: 20
					Height: 14
					Align: Right
					Font: Tiny
					Text: 4
				Checkbox@RMG_PREVENT_COLONY_OVERLAPPING:
					X: 20
					Y: 195
					Width: 355
					Height: 28
					Text: Prevent Colony Overlapping
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: On: keep colonies outside one another's turret range. Off: if the target cannot be reached, add colonies with the least possible range overlap. Buildings, exits and player starts stay clear.
				Label@RMG_LAYOUT_LABEL:
					X: 20
					Y: 195
					Width: 130
					Height: 28
					Text: Battlefield Plan
				DropDownButton@RMG_LAYOUT:
					X: 155
					Y: 195
					Width: 220
					Height: 28
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Select the strategic plan for Structured Competitive or Artificial Battlefield.
				Label@RMG_GRAVEL_MOSS_AMOUNT_LABEL:
					X: 20
					Y: 235
					Width: 195
					Height: 28
					Text: Surface Modifiers
				DropDownButton@RMG_GRAVEL_MOSS_AMOUNT:
					X: 220
					Y: 235
					Width: 155
					Height: 28
					Text: Standard
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Target percentages of non-water land: Low 10% gravel / 5% moss; Standard 14% / 8%; High 18% / 11%; Extreme 24% / 16%; Ultra 36% / 25%. Separate from Terrain Complexity.
				Checkbox@RMG_ORIGINAL_SURFACE_RELATIONS:
					X: 155
					Y: 275
					Width: 220
					Height: 28
					Text: Original surface relations
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Natural Landscape: Water-Dirt-Gravel-Moss transitions. Starts and colonies must fit existing dirt; terrain is never cleared for placement.
				Label@RMG_WATER_LABEL:
					X: 410
					Y: 35
					Width: 155
					Height: 28
					Text: Water Amount
				DropDownButton@RMG_WATER_AMOUNT:
					X: 570
					Y: 35
					Width: 220
					Height: 28
					Text: Standard
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Blocking water target: Regions Low 16%, Standard 20%, High 24%, Extreme 32%, Ultra 44%. Fixed tile transitions can reduce the achieved amount.
				Label@RMG_COLONY_LABEL:
					X: 410
					Y: 75
					Width: 155
					Height: 28
					Text: Neutral Colony Density
				DropDownButton@RMG_COLONY_DENSITY:
					X: 570
					Y: 75
					Width: 220
					Height: 28
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Select the neutral colony target. At 128 x 128, Extreme targets 32/40 colonies for 2/4 players; Ultra 52/64. At 256 x 256, targets triple. Existing terrain and the overlap setting determine capacity. Grey squares show placed colonies.
				Label@RMG_LAYOUT_FAMILY_LABEL:
					X: 410
					Y: 115
					Width: 155
					Height: 28
					Text: Layout Family
				DropDownButton@RMG_LAYOUT_FAMILY:
					X: 570
					Y: 115
					Width: 220
					Height: 28
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Natural Landscape uses Regions. Structured Competitive and Artificial Battlefield retain their historical generators at 128 x 128.

				Label@RMG_TERRAIN_COMPLEXITY_LABEL:
					X: 410
					Y: 155
					Width: 155
					Height: 28
					Text: Terrain Complexity
				DropDownButton@RMG_TERRAIN_COMPLEXITY:
					X: 570
					Y: 155
					Width: 220
					Height: 28
					Text: Standard
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Small through Ultra increase terrain detail within the same seed geography. Water Amount and Surface Modifiers control coverage separately. Land areas may be disconnected.
				Label@RMG_HOSTILES_NOTE:
					X: 410
					Y: 195
					Width: 380
					Height: 28
					Text: Hostiles are configured in lobby Options.
				Label@RMG_SEED_LABEL:
					X: 410
					Y: 235
					Width: 155
					Height: 28
					Text: Seed
				TextField@RMG_SEED:
					X: 570
					Y: 235
					Width: 150
					Height: 28
					Type: Integer
					MaxLength: 20
				Button@RMG_RANDOMIZE_BUTTON:
					X: 730
					Y: 235
					Width: 60
					Height: 28
					Text: Random
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Generate a new unsigned seed.
				Button@RMG_GENERATE_BUTTON:
					X: 570
					Y: 275
					Width: 220
					Height: 28
					Font: Bold
					Text: Generate Preview
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipText: Generate, validate, install, and select this map candidate.
				LabelWithTooltip@RMG_STATUS:
					X: 20
					Y: 308
					Width: 770
					Height: 38
					Font: Regular
					Align: Left
					VAlign: Top
					WordWrap: False
					TooltipContainer: TOOLTIP_CONTAINER
					TooltipTemplate: SIMPLE_TOOLTIP
				Label@RMG_PREVIEW_CAPTION:
					X: 845
					Y: 318
					Width: 287
					Height: 25
					Font: Bold
					Align: Center
					Text: Generated Map Preview
