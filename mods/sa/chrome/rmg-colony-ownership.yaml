Background@RMG_COLONY_OWNERSHIP_PANEL:
	Logic: RmgColonyOwnershipLogic
	X: (WINDOW_RIGHT - WIDTH) / 2
	Y: (WINDOW_BOTTOM - HEIGHT) / 2
	Width: 900
	Height: 650
	Background: dialog
	Children:
		Label@TITLE:
			X: 20
			Y: 14
			Width: PARENT_RIGHT - 40
			Height: 26
			Text: Neutral Colony Types
			Font: Bold
			Align: Center
		Label@HELP:
			X: 20
			Y: 44
			Width: PARENT_RIGHT - 40
			Height: 22
			Text: Weights are relative shares (0-100). Zero excludes a type; all zero disables neutral colonies.
		ScrollPanel@SETTINGS:
			X: 20
			Y: 80
			Width: PARENT_RIGHT - 40
			Height: PARENT_BOTTOM - 180
			TopBottomSpacing: 8
			Children:
				Container@ROW:
					Width: PARENT_RIGHT - 24
					Height: 65
					Visible: False
					Children:
						Label@LABEL:
							X: 10
							Width: PARENT_RIGHT - 20
							Height: 22
							Font: Bold
						Slider@SLIDER:
							X: 10
							Y: 28
							Width: 270
							Height: 22
						TextField@VALUE:
							X: 290
							Y: 25
							Width: 75
							Height: 27
							MaxLength: 5
						Button@DEFAULT:
							X: 375
							Y: 25
							Width: 125
							Height: 27
						Label@CHANCE:
							X: 510
							Y: 25
							Width: PARENT_RIGHT - 520
							Height: 27
						DropDownButton@CHOICE:
							X: 10
							Y: 25
							Width: 355
							Height: 27
							Visible: False
		Label@NOTE:
			X: 20
			Y: PARENT_BOTTOM - 89
			Width: PARENT_RIGHT - 40
			Height: 38
			WordWrap: True
		Button@RESET:
			X: 20
			Y: PARENT_BOTTOM - 43
			Width: 170
			Height: 28
			Text: Reset all shares
		Button@APPLY:
			X: PARENT_RIGHT - 270
			Y: PARENT_BOTTOM - 43
			Width: 120
			Height: 28
			Text: Apply
		Button@CANCEL:
			X: PARENT_RIGHT - 140
			Y: PARENT_BOTTOM - 43
			Width: 120
			Height: 28
			Text: Cancel
